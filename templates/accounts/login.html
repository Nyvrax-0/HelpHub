{% extends "base.html" %}
{% block title %}Вход · HelpHub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-3">Вход</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn btn-primary mt-3" type="submit">Войти</button>
      </form>
      <p class="mt-3 mb-0">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
