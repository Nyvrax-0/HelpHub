{% extends "base.html" %}
{% block title %}Регистрация · HelpHub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-3">Регистрация</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn btn-primary mt-3" type="submit">Создать аккаунт</button>
      </form>
      <p class="mt-3 mb-0">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
